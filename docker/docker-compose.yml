services:
  app:
    build:
      context: ..
      dockerfile: docker/dockerfile
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://lestallum:lestallum@db:5432/lestallum
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lestallum
      POSTGRES_PASSWORD: lestallum
      POSTGRES_DB: lestallum
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lestallum -d lestallum"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
