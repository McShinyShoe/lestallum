[package]
name = "shared"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1"
config = "0.15"
db = { path = "../db" }
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "rustls-no-provider",
    "webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
